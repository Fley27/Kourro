name: Consolidated Test Dashboard

on:
  schedule:
    - cron: "0 */6 * * *"   # refresh every 6 hours
  workflow_dispatch:
  repository_dispatch:
    types: [test-results-published]

env:
  NODE_VERSION: "20"

jobs:
  aggregate:
    name: Aggregate Reports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DASHBOARD_PAT }}
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Generate consolidated dashboard
        run: node scripts/aggregate-reports.js
      - name: Commit dashboard (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/index.html dashboard-data/
          if ! git diff --cached --quiet; then
            git commit -m "chore(dashboard): refresh consolidated test report"
            git push
          else
            echo "No changes to report dashboard."
          fi
