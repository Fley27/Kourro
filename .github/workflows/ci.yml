name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  preamble:
    name: Preamble
    runs-on: ubuntu-latest
    outputs:
      dashboard_commit: ${{ steps.det.outputs.is }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Detect dashboard-only commit
        id: det
        run: |
          msg=$(git log -1 --pretty=%s)
          echo "subject: $msg"
          if [[ "$msg" == chore\(dashboard\)* ]]; then
            echo "is=true" >> "$GITHUB_OUTPUT"
          else
            echo "is=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    needs: preamble
    if: needs.preamble.outputs.dashboard_commit != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      - name: Run lint (all workspaces)
        run: npm run lint || true
      - name: Publish lint summary
        if: always()
        run: |
          echo "## Lint" >> $GITHUB_STEP_SUMMARY
          echo "Result: **${{ job.status }}**" >> $GITHUB_STEP_SUMMARY

  typecheck:
    name: Typecheck
    needs: lint
    if: ${{ needs.lint.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      - name: Run typecheck (all workspaces)
        run: npm run typecheck
      - name: Publish typecheck summary
        if: always()
        run: |
          echo "## Typecheck" >> $GITHUB_STEP_SUMMARY
          echo "Result: **${{ job.status }}**" >> $GITHUB_STEP_SUMMARY

  unit:
    name: Unit Tests
    needs: typecheck
    if: ${{ needs.typecheck.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      - name: Run unit tests (middleware business logic)
        run: npx jest middleware --ci --coverage --coverageReporters=text --coverageReporters=lcov --coverageReporters=json
      - name: Publish unit summary
        if: always()
        run: |
          echo "## Unit Tests" >> $GITHUB_STEP_SUMMARY
          echo "Result: **${{ job.status }}**" >> $GITHUB_STEP_SUMMARY
      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-${{ github.run_id }}
          path: coverage/
          retention-days: 7

  component:
    name: Component Tests
    needs: unit
    if: ${{ needs.unit.result == 'success' && github.event_name != 'pull_request' || needs.unit.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      - name: Check admin-portal present
        id: check-admin
        run: |
          if [ -d admin-portal/src ]; then echo "exists=true" >> $GITHUB_OUTPUT; else echo "exists=false" >> $GITHUB_OUTPUT; fi
      - name: Run component tests (admin portal screens)
        if: steps.check-admin.outputs.exists == 'true'
        run: npx jest admin-portal --ci
      - name: Publish component summary
        if: always()
        run: |
          echo "## Component Tests" >> $GITHUB_STEP_SUMMARY
          echo "Result: **${{ job.status }}**" >> $GITHUB_STEP_SUMMARY

  e2e:
    name: End-to-End Tests
    needs: component
    if: ${{ needs.component.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      - name: Check web-app present
        id: check-web
        run: |
          if [ -d web-app/src ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install Playwright browsers
        if: steps.check-web.outputs.exists == 'true'
        run: npx playwright install --with-deps chromium
      - name: Build web app for preview
        if: steps.check-web.outputs.exists == 'true'
        run: npm run build --workspace=web-app
      - name: "Run E2E tests (web app flow: shift, sale, daily report, sync)"
        if: steps.check-web.outputs.exists == 'true'
        run: npx playwright test --workers=1
      - name: Publish E2E summary
        if: always()
        run: |
          echo "## End-to-End Tests" >> $GITHUB_STEP_SUMMARY
          echo "Result: **${{ job.status }}**" >> $GITHUB_STEP_SUMMARY
      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ github.run_id }}
          path: |
            e2e/
            playwright-report/
          retention-days: 7

  report:
    name: Consolidated Report
    needs: [preamble, lint, typecheck, unit, component, e2e]
    if: ${{ !failure() && !cancelled() && needs.preamble.outputs.dashboard_commit != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies (for scripts deps)
        run: npm install --legacy-peer-deps
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      - name: Build consolidated dashboard summary
        run: |
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          sha="${{ github.sha }}"
          run="${{ github.run_id }}"
          url="https://github.com/${{ github.repository }}/actions/runs/${run}"
          cat > dashboard-data/kourro.json <<EOF
            {"repo":"Fley27/Kourro","run_id":${run},"sha":"${sha}","updated_at":"${now}","lint":"${{ needs.lint.result }}","typecheck":"${{ needs.typecheck.result }}","unit":"${{ needs.unit.result }}","component":"${{ needs.component.result }}","e2e":"${{ needs.e2e.result }}","url":"${url}"}
          EOF
          node scripts/aggregate-reports.js
          cat reports/dashboard.md >> $GITHUB_STEP_SUMMARY
      - name: Commit dashboard via Contents API
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_PAT }}
        run: |
          put () {
            file="$1"
            msg="$2"
            echo "publishing $file"
            local sha
            sha="$(gh api "repos/${{ github.repository }}/contents/$file" --jq .sha 2>/dev/null || true)"
            local args=(-X PUT -f message="$msg" -f branch=main -f content="$(base64 -w0 "$file")")
            if [ -n "$sha" ]; then args+=(-f sha="$sha"); fi
            gh api "repos/${{ github.repository }}/contents/$file" "${args[@]}" > /dev/null && echo "updated $file via API"
          }
          put dashboard-data/kourro.json "chore(dashboard): publish kourro results"
          put reports/index.html "chore(dashboard): refresh consolidated report"
          put reports/dashboard.md "chore(dashboard): refresh markdown summary"
      - name: Trigger cross-repo dashboard refresh
        continue-on-error: true
        run: |
          curl -s -X POST https://api.github.com/repos/${{ github.repository }}/dispatches \
            -H "Authorization: Bearer ${{ secrets.DASHBOARD_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            -d '{"event_type":"test-results-published","client_payload":{"repo":"${{ github.repository }}","run_id":"${{ github.run_id }}"}}' >/dev/null || true
