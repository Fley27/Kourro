<!doctype html>
<html lang="ht">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <title>Kourro</title>
    <meta name="description" content="Kourro — Bati yon biznis ki ap siviv ou. POS offline-first pou magazen Ayisyen." />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kourro" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        padding: 0;
        background: #000;
      }
      body {
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Registered before the module graph loads: import-time crashes
         (e.g. a bad dependency bundle) would otherwise leave a silent
         black shell with no on-screen trace. -->
    <script>
      (function () {
        function showFatal(message, detail) {
          try {
            console.error("[fatal]", message, detail || "");
            var host = document.getElementById("fatal-host");
            if (!host) {
              host = document.createElement("div");
              host.id = "fatal-host";
              host.style.cssText =
                "position:fixed;inset:0;z-index:2147483699;background:#14110b;color:#f6f1e4;" +
                "font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;padding:24px;" +
                "overflow:auto;white-space:pre-wrap;word-break:break-word";
              document.body.appendChild(host);
            }
            host.textContent = "RUNTIME ERROR\n\n" + message + (detail ? "\n\n" + detail : "");
          } catch (_) {}
        }
        window.addEventListener("error", function (event) {
          var err = event.error;
          showFatal(String(event.message || err || "unknown error"), err && err.stack);
        });
        window.addEventListener("unhandledrejection", function (event) {
          var reason = event.reason || {};
          showFatal(
            "Unhandled rejection: " + (reason.message || String(event.reason)),
            reason.stack
          );
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
